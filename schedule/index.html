*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%}body{margin:0;font-family:'PingFang TC','Microsoft JhengHei','Noto Sans TC',system-ui,sans-serif;background:#1C1815;color:#F2EBDD}
.page{max-width:1100px;margin:0 auto;padding:20px 14px calc(88px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.eyebrow{font-size:12px;letter-spacing:2px;color:#C9A03E;margin-bottom:4px}
h1{font-family:Georgia,'Noto Serif TC',serif;font-size:24px;margin:0;font-weight:600}
.month-nav{display:flex;align-items:center;gap:14px;background:#262019;border-radius:10px;padding:8px 16px}
.nav-arrow{font-size:24px;color:#C9A03E;user-select:none;padding:4px 8px;cursor:pointer}
.month-label{font-size:16px;min-width:96px;text-align:center}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.btn{padding:11px 16px;border-radius:8px;font-size:14px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;user-select:none}
.shine{position:relative;overflow:hidden;background-size:220% 220%!important;animation:chromeShift 7s ease-in-out infinite}
.shine::after{content:"";position:absolute;top:-30%;left:-60%;width:35%;height:160%;background:linear-gradient(120deg,transparent,rgba(255,255,255,0.85),transparent);transform:skewX(-20deg);animation:shineSweep 3.2s ease-in-out infinite;pointer-events:none}
@keyframes chromeShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}@keyframes shineSweep{0%{left:-60%}45%{left:130%}100%{left:130%}}
.chrome-silver{background:linear-gradient(160deg,#fafafa 0%,#d4d4d4 25%,#f4f4f4 45%,#aaaaaa 65%,#eaeaea 85%,#c7c7c7 100%);color:#2a2a2a;border:1px solid rgba(255,255,255,0.6);box-shadow:inset 0 1px 2px rgba(255,255,255,0.9),inset 0 -2px 3px rgba(0,0,0,0.25),0 3px 8px rgba(0,0,0,0.35)}
.chrome-gold{background:linear-gradient(160deg,#fff6d8 0%,#e7c465 25%,#fff0b8 45%,#a8781f 65%,#f6e0a3 85%,#cda247 100%);color:#3a2e12;border:1px solid rgba(255,244,200,0.6);box-shadow:inset 0 1px 2px rgba(255,255,255,0.9),inset 0 -2px 3px rgba(0,0,0,0.3),0 3px 8px rgba(0,0,0,0.35)}
.chrome-rose{background:linear-gradient(160deg,#ffe3ea 0%,#e8a0b5 25%,#ffd6e0 45%,#b45770 65%,#f8c3d1 85%,#d98aa0 100%);color:#3a1520;border:1px solid rgba(255,230,236,0.6);box-shadow:inset 0 1px 2px rgba(255,255,255,0.9),inset 0 -2px 3px rgba(0,0,0,0.3),0 3px 8px rgba(0,0,0,0.35)}
.btn.primary{font-weight:600}
.sync-status{font-size:12px;color:#8A8175;margin-left:auto;display:flex;align-items:center;gap:6px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#6B6459;display:inline-block}
.sync-dot.ok{background:#8FBF8F}.sync-dot.err{background:#D98A8A}.sync-dot.busy{background:#E8C36A;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.legend-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid #322A22}
.legend-item{display:flex;align-items:center;gap:6px}.legend-swatch{width:14px;height:14px;border-radius:3px;display:inline-block}.legend-text{font-size:12.5px;color:#C7BEB0}
.panel{background:#262019;border-radius:10px;padding:14px;margin-bottom:16px;display:none}.panel.open{display:block}
.panel-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.panel-row input[type=text]{flex:1;min-width:160px;padding:12px 12px;border-radius:8px;border:1px solid #45413A;background:#1C1815;color:#F2EBDD;font-size:16px;outline:none}
.staff-chips{display:flex;flex-wrap:wrap;gap:8px}.chip{display:flex;align-items:center;gap:8px;background:#322A22;border-radius:20px;padding:8px 12px 8px 14px;font-size:14px}.chip .rm{color:#D98A8A;cursor:pointer;font-size:15px;padding:2px 4px}
.empty-text{font-size:13px;color:#8A8175}
.save-status{font-size:12px;color:#8A8175;margin-bottom:12px;min-height:16px}.save-status.ok{color:#8FBF8F}.save-status.err{color:#D98A8A}
.calendar-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;text-align:center;font-size:11px;color:#8A8175}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.calendar-day{background:#241E17;border-radius:8px;padding:6px 4px;min-height:60px;display:flex;flex-direction:column;gap:3px;cursor:pointer;border:1px solid transparent}
.calendar-day.empty{background:transparent;cursor:default}.calendar-day.today{border-color:#C9A03E}.calendar-day .date-num{font-size:13px;font-weight:700;color:#C7BEB0}.calendar-day.weekend .date-num{color:#D98A8A}.calendar-day .day-dots{display:flex;flex-wrap:wrap;gap:3px}.calendar-day .day-dot{width:8px;height:8px;border-radius:2px}.calendar-day .day-count{font-size:10px;color:#8A8175;margin-top:auto}
.month-summary{background:#262019;border-radius:10px;padding:12px 14px;margin-bottom:16px}.month-summary-title{font-size:13px;font-weight:600;color:#C9A03E;margin-bottom:8px}.month-summary-row{display:flex;justify-content:space-between;font-size:12.5px;color:#C7BEB0;padding:5px 0;border-bottom:1px solid #322A22}.month-summary-row:last-child{border-bottom:none}.month-summary-row .counts{display:flex;gap:8px;white-space:nowrap}
.day-detail-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #322A22}.day-detail-row:last-child{border-bottom:none}.day-detail-row .name{font-size:14px;color:#F2EBDD}
.clock-section{background:#262019;border-radius:10px;padding:16px;margin-bottom:20px}.clock-title{font-size:16px;font-weight:600;margin-bottom:12px;color:#F2EBDD;display:flex;align-items:center;gap:6px}
