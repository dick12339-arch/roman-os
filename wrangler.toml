# Roman OS v1.2 - Cloudflare Pages + D1 綁定
name = "roman-os"
type = "javascript"
compatibility_date = "2024-09-26"

# Pages 會自動讀取 functions/，這裡只定義 D1
[[d1_databases]]
binding = "DB"
database_name = "roman-os-db"
# ⚠️ 請把下面 id 換成你 npx wrangler d1 create 後拿到的 id
database_id = "REPLACE_WITH_YOUR_D1_ID"

# 如果你有 Google Apps Script，保留 env
[vars]
GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxCJVTtQF8YyGYFsT89hG2mEJHV1KR-3rQY/exec"

[build]
command = ""
